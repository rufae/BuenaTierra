name: deploy-hp

# Despliega en el servidor SOLO cuando el CI de esta rama queda verde
# (trigger workflow_run; un push ya no dispara el CD directamente, y una
# conclusion != success no despliega). Ejecuta el script de auto-update del servidor,
# que hace stash→pull→pop de los cambios locales y luego el hook de
# rebuild (api + frontend + nginx). El timer diario se mantiene como red de
# seguridad y workflow_dispatch permite forzar un despliegue manual.
on:
  workflow_run:
    workflows: ["CI — Build · Test · Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Verde del CI (solo pushes) o despliegue manual explícito.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    env:
      # Gate de CI verde de auto_update.sh: sólo el despliegue manual lo
      # salta; el workflow_run siempre llega con el CI en success.
      FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - name: auto_update
        run: bash "$HOME/proyectos/rafita/scripts/auto_update.sh"
