include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: src/BuenaTierra.API/Dockerfile
      target: build
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-buenatierra};Username=${POSTGRES_USER:-buenatierra_admin};Password=${POSTGRES_PASSWORD};Pooling=true;"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ExpiresInMinutes: 30
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
